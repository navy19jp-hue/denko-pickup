<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>株式会社J.style 拾い出しアプリ</title>
<style>
body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#111827;color:#fff;padding:18px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:21px}header p{margin:5px 0 0;font-size:12px;opacity:.8}
main{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #d9e0e8;border-radius:15px;padding:15px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
label{display:block;font-size:12px;color:#687386;font-weight:700;margin-bottom:4px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;background:#fff;box-sizing:border-box}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;font-size:14px}.blue{background:#1769d1;color:#fff}.green{background:#238636;color:#fff}.gray{background:#e9eef5;color:#253044}.red{background:#fff0f0;color:#c62828}
.actions{display:flex;gap:7px;flex-wrap:wrap}.hint{font-size:12px;color:#687386;line-height:1.5}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:#f2f5f9;padding:11px;border-radius:11px}.kpi b{display:block;font-size:18px;margin-top:2px}
.item,.master{border:1px solid #d9e0e8;border-radius:12px;padding:11px;margin:9px 0;background:#fbfcfd}.itemgrid{display:grid;grid-template-columns:.8fr 1fr 1fr 1.4fr .75fr;gap:7px}.total{text-align:right;font-size:20px;font-weight:900;margin-top:12px}.badge{background:#fff3c4;border-radius:99px;padding:3px 7px;font-size:11px}
@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}.itemgrid{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.kpi:last-child{grid-column:1/-1}}
@media print{header,.actions{display:none!important}body{background:#fff}}
</style></head><body>
<header><h1>株式会社J.style 拾い出しアプリ</h1><p>図面を見ながら入力 → 自動集計 → 見積用データ</p></header><main>
<section class="card"><h2>① 案件情報</h2><div class="grid">
<div><label>案件名</label><input id="project" placeholder="例：〇〇新築工事"></div>
<div><label>元請・客先</label><input id="client" placeholder="例：株式会社〇〇"></div>
<div><label>施工場所</label><input id="place" placeholder="例：富山市〇〇"></div>
<div><label>担当者</label><input id="person" placeholder="例：野島"></div></div></section>

<section class="card"><h2>② 拾い出し</h2><div class="kpis">
<div class="kpi">登録品目<b id="itemCount">0</b></div><div class="kpi">総数量<b id="qtyCount">0</b></div><div class="kpi">定価合計<b id="listTotal">¥0</b></div></div>
<div class="actions"><button class="blue" id="add">＋ 項目追加</button><button class="gray" id="clear">全削除</button></div>
<p class="hint">図面を目視で確認し、区分・品名・メーカー・型番/品番・定価・数量を入力してください。入力内容はこのiPhoneのブラウザに自動保存されます。</p><div id="items"></div></section>

<section class="card"><h2>③ 商品マスター</h2><p class="hint">よく使う器具・スイッチ・コンセント等を登録すると、次回から検索して呼び出せます。</p>
<div class="grid3"><div><label>検索</label><input id="search" placeholder="メーカー・型番・品名"></div><div><button class="blue" id="newMaster">＋ マスター登録</button></div><div><button class="gray" id="samples">サンプルを追加</button></div></div><div id="masters"></div></section>

<section class="card"><h2>④ 見積集計</h2><div class="grid3">
<div><label>材料掛率（定価×）</label><input id="rate" type="number" step=".01" value="1"></div>
<div><label>労務費</label><input id="labor" type="number" min="0" value="0"></div>
<div><label>諸経費</label><input id="expense" type="number" min="0" value="0"></div></div><div class="total" id="quote">見積小計 ¥0</div></section>

<section class="card"><h2>⑤ データ出力</h2><div class="actions">
<button class="green" id="json">JSON出力</button><button class="gray" id="csv">CSV出力</button><button class="gray" id="print">印刷</button><button class="red" id="reset">アプリデータを初期化</button></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
let items=JSON.parse(localStorage.getItem("jstyle_final_items")||"[]");
let masters=JSON.parse(localStorage.getItem("jstyle_final_masters")||"[]");
const samples=[
["照明","大光電機","DDL-6222 WW","ダウンライト",6400],["照明","大光電機","DDL-6224 WW","ダウンライト",9000],["照明","大光電機","DDL-6282 WW","ダウンライト",21500],["照明","Fritz Hansen","CARAVAGGIO MATT P2","ペンダント",72380],
["コンセント","Panasonic","","2口コンセント",0],["コンセント","Panasonic","","アース付コンセント",0],["スイッチ","Panasonic","","片切スイッチ",0],["スイッチ","Panasonic","","3路スイッチ",0],["通信","Panasonic","","LAN端子",0],["通信","Panasonic","","TV端子",0],["通信","Panasonic","","TEL端子",0],["盤","Panasonic","","分電盤",0]];
const cats=["照明","スイッチ","コンセント","通信","盤","配管・配線","その他"];
const yen=n=>"¥"+Math.round(Number(n)||0).toLocaleString("ja-JP");
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function save(){localStorage.setItem("jstyle_final_items",JSON.stringify(items));localStorage.setItem("jstyle_final_masters",JSON.stringify(masters))}
function calc(){let q=items.reduce((a,x)=>a+(+x.qty||0),0),t=items.reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0);$("itemCount").textContent=items.length;$("qtyCount").textContent=q;$("listTotal").textContent=yen(t);$("quote").textContent="見積小計 "+yen(t*(+$("rate").value||0)+(+$("labor").value||0)+(+$("expense").value||0))}
function renderItems(){let r=$("items");r.innerHTML="";if(!items.length){r.innerHTML='<p class="hint">まだ項目がありません。「＋ 項目追加」から始めてください。</p>';calc();return}
items.forEach((x,i)=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="itemgrid">
<div><label>区分</label><select data-k="cat">${cats.map(c=>`<option ${c==x.cat?"selected":""}>${c}</option>`).join("")}</select></div>
<div><label>メーカー</label><input data-k="maker" value="${esc(x.maker)}" placeholder="メーカー"></div>
<div><label>型番/品番</label><input data-k="model" value="${esc(x.model)}" placeholder="型番・品番"></div>
<div><label>品名</label><input data-k="name" value="${esc(x.name)}" placeholder="品名"></div>
<div><label>数量</label><input data-k="qty" type="number" min="0" value="${x.qty||1}"></div></div>
<div class="grid" style="margin-top:7px"><div><label>定価（円）</label><input data-k="price" type="number" min="0" value="${x.price||0}"></div><div><label>場所・備考</label><input data-k="note" value="${esc(x.note)}" placeholder="例：1階 洋室"></div></div>
<div class="actions" style="margin-top:8px"><button class="blue" data-master>マスターから選択</button><button class="red" data-del>削除</button><span class="badge">数量は目視確認</span></div><div class="hint">金額：<b>${yen((+x.qty||0)*(+x.price||0))}</b></div>`;
d.querySelectorAll("[data-k]").forEach(e=>e.oninput=()=>{x[e.dataset.k]=e.type==="number"?+e.value:e.value;save();renderItems()});
d.querySelector("[data-del]").onclick=()=>{items.splice(i,1);save();renderItems()};d.querySelector("[data-master]").onclick=()=>pickMaster(i);r.appendChild(d)});calc()}
function pickMaster(i){let q=prompt("検索（メーカー・型番・品名）");if(q===null)return;let h=masters.filter(m=>(m.maker+" "+m.model+" "+m.name).toLowerCase().includes(q.toLowerCase()));if(!h.length){alert("該当するマスターがありません。");return}let n=+prompt(h.map((m,i)=>`${i+1}: ${m.maker} / ${m.model} / ${m.name} / ${yen(m.price)}`).join("\n")+"\n\n番号を入力")-1;if(!h[n])return;items[i]={...items[i],cat:h[n].cat,maker:h[n].maker,model:h[n].model,name:h[n].name,price:+h[n].price||0};save();renderItems()}
function renderMasters(){let q=$("search").value.toLowerCase(),a=masters.filter(m=>(m.cat+" "+m.maker+" "+m.model+" "+m.name).toLowerCase().includes(q));$("masters").innerHTML=a.map(m=>`<div class="master"><div class="grid3">
<div><label>区分</label><input data-mid="${m.id}" data-k="cat" value="${esc(m.cat)}"></div><div><label>メーカー</label><input data-mid="${m.id}" data-k="maker" value="${esc(m.maker)}"></div><div><label>型番/品番</label><input data-mid="${m.id}" data-k="model" value="${esc(m.model)}"></div></div>
<div class="grid3" style="margin-top:7px"><div><label>品名</label><input data-mid="${m.id}" data-k="name" value="${esc(m.name)}"></div><div><label>定価</label><input data-mid="${m.id}" data-k="price" type="number" value="${m.price||0}"></div><div><button class="red" data-remove="${m.id}">削除</button></div></div></div>`).join("")||'<p class="hint">マスターはまだありません。</p>';
document.querySelectorAll("[data-mid]").forEach(e=>e.oninput=()=>{let m=masters.find(x=>x.id===e.dataset.mid);m[e.dataset.k]=e.type==="number"?+e.value:e.value;save()});
document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{masters=masters.filter(m=>m.id!==b.dataset.remove);save();renderMasters()})}
$("add").onclick=()=>{items.push({cat:"照明",maker:"",model:"",name:"",price:0,qty:1,note:""});save();renderItems()};
$("clear").onclick=()=>{if(confirm("拾い出し項目を全部削除しますか？")){items=[];save();renderItems()}};
$("newMaster").onclick=()=>{masters.push({id:"m"+Date.now()+Math.random(),cat:"その他",maker:"",model:"",name:"",price:0});save();renderMasters()};
$("samples").onclick=()=>{samples.forEach(s=>{if(!masters.some(m=>m.maker===s[1]&&m.model===s[2]&&m.name===s[3]))masters.push({id:"m"+Date.now()+Math.random(),cat:s[0],maker:s[1],model:s[2],name:s[3],price:s[4]})});save();renderMasters();alert("サンプルを追加しました。")};
$("search").oninput=renderMasters;["rate","labor","expense"].forEach(id=>$(id).oninput=calc);$("print").onclick=()=>window.print();
function dl(n,d,t){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()}
$("json").onclick=()=>dl("Jstyle_拾い出しデータ.json",JSON.stringify({app:"株式会社J.style 拾い出しアプリ",project:{name:$("project").value,client:$("client").value,place:$("place").value,person:$("person").value},items,quote:{rate:+$("rate").value||0,labor:+$("labor").value||0,expense:+$("expense").value||0}},null,2),"application/json");
$("csv").onclick=()=>{let r=[["区分","メーカー","型番/品番","品名","定価","数量","金額","場所・備考"],...items.map(x=>[x.cat,x.maker,x.model,x.name,x.price,x.qty,(+x.price||0)*(+x.qty||0),x.note])];dl("Jstyle_拾い出しデータ.csv","\ufeff"+r.map(a=>a.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv")};
$("reset").onclick=()=>{if(confirm("案件データと商品マスターを初期化します。")){localStorage.clear();location.reload()}}
renderItems();renderMasters();calc();
</script></body></html>
