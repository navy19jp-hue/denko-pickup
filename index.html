<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電工拾い出し</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f4f6f8;color:#202733}
header{background:#111827;color:white;padding:18px 20px;position:sticky;top:0;z-index:10}h1{margin:0;font-size:23px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}
main{max-width:1100px;margin:auto;padding:16px}.card{background:white;border:1px solid #dce2e8;border-radius:12px;padding:17px;margin-bottom:15px}h2{font-size:18px;margin:0 0 14px;border-left:4px solid #1769e0;padding-left:9px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-size:12px;color:#667085;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
.upload{border:2px dashed #b8c4d2;border-radius:12px;padding:22px;text-align:center;background:#f8fafc}.upload input{display:none}.upload label{display:inline-block;background:#1769e0;color:white;padding:11px 18px;border-radius:8px;font-weight:700}.preview{margin-top:12px;text-align:center}.preview img{max-width:100%;max-height:400px}.preview iframe{width:100%;height:450px;border:1px solid #ddd}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700}.primary{background:#1769e0;color:white}.success{background:#198754;color:white}.gray{background:#e9eef4}.danger{background:#fee2e2;color:#b42318}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{border-bottom:1px solid #dce2e8;padding:7px}th{background:#f1f5f9;font-size:12px}td input{width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:6px}.num{text-align:right}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{background:#f8fafc;border:1px solid #dce2e8;border-radius:9px;padding:12px}.box small{display:block;color:#667085}.box strong{font-size:20px}.total{background:#e8f1ff;border-color:#9fc2ff}
.note{font-size:12px;color:#667085;line-height:1.6}.tag{display:inline-block;background:#e8f1ff;color:#1458b8;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px}
footer{text-align:center;padding:25px;color:#667085;font-size:12px}
@media(max-width:750px){.grid,.summary{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.summary{grid-template-columns:1fr}}
@media print{header,.no-print,.upload,.preview{display:none!important}body{background:white}.card{border:0;box-shadow:none}}
</style>
</head>
<body>
<header><h1>⚡ 電工拾い出し</h1><p>電気工事・空調工事の数量拾い出し／見積計算</p></header>
<main>

<section class="card">
<h2>案件情報</h2>
<div class="grid">
<div class="field"><label>案件名</label><input id="project" placeholder="例：富山新事務所 電気工事"></div>
<div class="field"><label>元請・会社名</label><input id="customer" placeholder="会社名"></div>
<div class="field"><label>担当者</label><input id="person" placeholder="担当者"></div>
<div class="field"><label>見積日</label><input id="date" type="date"></div>
</div>
</section>

<section class="card">
<h2>図面・PDF</h2>
<div class="upload">
<input id="file" type="file" accept=".pdf,image/*">
<label for="file">📎 図面・PDFを選択</label>
<div id="filename" class="note">PDFまたは画像を選択</div>
</div>
<div id="preview" class="preview"></div>
<p class="note">図面を表示しながら、下の拾い出し表へ数量を入力できます。</p>
</section>

<section class="card">
<h2>拾い出し</h2>
<div class="actions no-print">
<button class="btn primary" onclick="addRow()">＋ 項目追加</button>
<button class="btn success" onclick="addPreset()">標準項目を一括追加</button>
<button class="btn danger" onclick="clearRows()">全削除</button>
</div><br>
<div class="table-wrap"><table id="items">
<thead><tr><th>区分</th><th>品名・仕様</th><th>数量</th><th>単位</th><th>材料単価</th><th>材料金額</th><th>労務単価</th><th>労務金額</th><th class="no-print">削除</th></tr></thead>
<tbody></tbody></table></div>
</section>

<section class="card">
<h2>経費設定</h2>
<div class="grid">
<div class="field"><label>材料掛率 %</label><input id="matRate" type="number" value="100" oninput="calc()"></div>
<div class="field"><label>労務掛率 %</label><input id="laborRate" type="number" value="100" oninput="calc()"></div>
<div class="field"><label>諸経費 %</label><input id="expenseRate" type="number" value="10" oninput="calc()"></div>
<div class="field"><label>消費税 %</label><input id="taxRate" type="number" value="10" oninput="calc()"></div>
</div>
</section>

<section class="card">
<h2>見積集計</h2>
<div class="summary">
<div class="box"><small>材料費</small><strong id="matTotal">¥0</strong></div>
<div class="box"><small>労務費</small><strong id="laborTotal">¥0</strong></div>
<div class="box"><small>諸経費</small><strong id="expenseTotal">¥0</strong></div>
<div class="box total"><small>税込見積金額</small><strong id="grandTotal">¥0</strong></div>
</div><br>
<div class="actions no-print">
<button class="btn success" onclick="exportCSV()">CSV出力</button>
<button class="btn gray" onclick="window.print()">🖨 印刷／PDF保存</button>
<button class="btn gray" onclick="saveData()">💾 保存</button>
<button class="btn gray" onclick="loadData()">↩ 読込</button>
</div>
</section>

<section class="card">
<h2>対応する主な拾い出し</h2>
<span class="tag">照明</span><span class="tag">スイッチ</span><span class="tag">コンセント</span><span class="tag">LAN</span><span class="tag">電話</span><span class="tag">分電盤</span><span class="tag">ブレーカー</span><span class="tag">PF管</span><span class="tag">CD管</span><span class="tag">電線管</span><span class="tag">ケーブル</span><span class="tag">ラック</span><span class="tag">接地</span><span class="tag">エアコン電源</span>
<p class="note">材料単価・労務単価は案件ごとに変更してください。</p>
</section>
</main>
<footer>電工拾い出し © 2026</footer>

<script>
const preset=[
["照明","LED照明器具",1,"台",12000,3500],
["電源","2P15Aコンセント",1,"個",900,800],
["電源","3路スイッチ",1,"個",1200,900],
["LAN","LANコンセント Cat6",1,"個",1800,1000],
["配線","VVF 2.0-2C",10,"m",180,120],
["配線","VVF 2.0-3C",10,"m",260,140],
["配管","PF管22",10,"m",220,150],
["盤","分電盤",1,"面",35000,8000],
["接地","接地工事",1,"式",12000,6000],
["空調","エアコン電源工事",1,"式",18000,9000]
];
date.value=new Date().toISOString().slice(0,10);

file.addEventListener("change",e=>{
 const f=e.target.files[0];if(!f)return;
 filename.textContent=f.name+" ("+Math.round(f.size/1024)+"KB)";
 preview.innerHTML="";
 const u=URL.createObjectURL(f);
 if(f.type.startsWith("image/")){let i=document.createElement("img");i.src=u;preview.appendChild(i)}
 else if(f.type==="application/pdf"){let p=document.createElement("iframe");p.src=u;preview.appendChild(p)}
});

function addRow(d=["","",1,"式",0,0]){
 const tr=document.createElement("tr");
 tr.innerHTML='<td><input value="'+d[0]+'"></td><td><input value="'+d[1]+'"></td><td><input type="number" min="0" step="0.01" value="'+d[2]+'" oninput="calc()"></td><td><input value="'+d[3]+'"></td><td><input type="number" min="0" value="'+d[4]+'" oninput="calc()"></td><td class="num mat">¥0</td><td><input type="number" min="0" value="'+d[5]+'" oninput="calc()"></td><td class="num labor">¥0</td><td class="no-print"><button class="btn danger" onclick="this.closest(\'tr\').remove();calc()">削除</button></td>';
 document.querySelector("#items tbody").appendChild(tr);calc();
}
function addPreset(){preset.forEach(addRow)}
function clearRows(){if(confirm("全項目を削除しますか？")){document.querySelector("#items tbody").innerHTML="";calc()}}
function yen(n){return "¥"+Math.round(n).toLocaleString("ja-JP")}
function calc(){
 let m=0,l=0;
 document.querySelectorAll("#items tbody tr").forEach(tr=>{
  let q=+tr.cells[2].querySelector("input").value||0,mp=+tr.cells[4].querySelector("input").value||0,lp=+tr.cells[6].querySelector("input").value||0;
  let mm=q*mp*(+matRate.value||0)/100,ll=q*lp*(+laborRate.value||0)/100;
  tr.querySelector(".mat").textContent=yen(mm);tr.querySelector(".labor").textContent=yen(ll);m+=mm;l+=ll;
 });
 let ex=(m+l)*(+expenseRate.value||0)/100,sub=m+l+ex,tax=sub*(+taxRate.value||0)/100;
 matTotal.textContent=yen(m);laborTotal.textContent=yen(l);expenseTotal.textContent=yen(ex);grandTotal.textContent=yen(sub+tax);
}
function rows(){return [...document.querySelectorAll("#items tbody tr")].map(t=>[t.cells[0].querySelector("input").value,t.cells[1].querySelector("input").value,t.cells[2].querySelector("input").value,t.cells[3].querySelector("input").value,t.cells[4].querySelector("input").value,t.cells[6].querySelector("input").value])}
function exportCSV(){
 let c="区分,品名・仕様,数量,単位,材料単価,材料金額,労務単価,労務金額\n";
 document.querySelectorAll("#items tbody tr").forEach(t=>c+=[t.cells[0].querySelector("input").value,t.cells[1].querySelector("input").value,t.cells[2].querySelector("input").value,t.cells[3].querySelector("input").value,t.cells[4].querySelector("input").value,t.querySelector(".mat").textContent.replace(/[¥,]/g,""),t.cells[6].querySelector("input").value,t.querySelector(".labor").textContent.replace(/[¥,]/g,"")].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(",")+"\n");
 let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download=(project.value||"電工拾い出し")+".csv";a.click();
}
function saveData(){
 localStorage.setItem("denkoPickup",JSON.stringify({project:project.value,customer:customer.value,person:person.value,date:date.value,matRate:matRate.value,laborRate:laborRate.value,expenseRate:expenseRate.value,taxRate:taxRate.value,rows:rows()}));alert("この端末に保存しました。");
}
function loadData(){
 let d=JSON.parse(localStorage.getItem("denkoPickup")||"null");if(!d)return alert("保存データがありません。");
 project.value=d.project||"";customer.value=d.customer||"";person.value=d.person||"";date.value=d.date||"";matRate.value=d.matRate||100;laborRate.value=d.laborRate||100;expenseRate.value=d.expenseRate||10;taxRate.value=d.taxRate||10;
 document.querySelector("#items tbody").innerHTML="";(d.rows||[]).forEach(addRow);calc();alert("読み込みました。");
}
calc();
</script>
</body></html>
