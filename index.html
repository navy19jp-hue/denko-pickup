<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>株式会社J.style 拾い出しアプリ</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;margin:0;background:#f5f7f9;color:#17202a}
header{background:#111827;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:3}
header h1{font-size:20px;margin:0 0 4px} header p{margin:0;opacity:.75;font-size:12px}
main{max-width:1100px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid #dbe1e8;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0000000a}
h2{font-size:17px;margin:0 0 12px}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:#1976d2;color:white}
button.secondary{background:#e8edf3;color:#26323d} button.green{background:#238636}
input,select{padding:10px;border:1px solid #cbd5df;border-radius:9px;font-size:14px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.drop{border:2px dashed #aeb9c6;border-radius:12px;padding:25px;text-align:center;background:#fafcff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e6e9ed;text-align:left}th{background:#f1f4f7;position:sticky;top:70px}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#fff3cd;color:#765600;font-size:11px}
.status{font-size:13px;color:#52606d;margin-top:8px}
.total{font-size:20px;font-weight:800;text-align:right}
@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}table{font-size:12px}th,td{padding:6px}}
</style>
</head>
<body>
<header><h1>株式会社J.style 拾い出しアプリ</h1><p>図面PDF・画像 → 電気設備拾い出し → 見積データ</p></header>
<main>
<section class="card">
<h2>① 図面アップロード</h2>
<div class="drop" id="drop">PDFまたは画像を選択<br><br><input id="file" type="file" accept=".pdf,image/*"></div>
<div class="status" id="fileStatus">ファイル未選択</div>
</section>

<section class="card">
<h2>② 案件情報</h2>
<div class="grid">
<input id="project" placeholder="案件名">
<input id="customer" placeholder="施主・客先">
<input id="site" placeholder="施工場所">
<input id="drawing" placeholder="図面名称">
</div>
</section>

<section class="card">
<h2>③ 拾い出し結果</h2>
<p class="status">図面から候補項目を作成します。数量はAI/画像解析の結果を確認して確定してください。</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
<button id="add">項目追加</button>
<button class="green" id="analyze">図面を解析する</button>
<button class="secondary" id="export">JSON出力</button>
</div>
<div style="overflow:auto">
<table id="tbl"><thead><tr>
<th>区分</th><th>記号</th><th>品名</th><th>仕様</th><th>数量</th><th>単位</th><th>メーカー</th><th>型番/品番</th><th>定価</th><th>状態</th>
</tr></thead><tbody></tbody></table>
</div>
</section>

<section class="card">
<h2>④ 見積集計</h2>
<div class="grid">
<input id="material" type="number" placeholder="材料費">
<input id="labor" type="number" placeholder="労務費">
<input id="expense" type="number" placeholder="経費">
<input id="tax" type="number" value="10" placeholder="消費税%">
</div>
<div class="total" id="total">合計 0 円</div>
</section>
</main>
<script>
const items=[
["照明","CL","直付けシーリング","","","個"],
["照明","DL","ダウンライト","","","個"],
["照明","","ペンダント","","","個"],
["スイッチ","","スイッチ","","","個"],
["スイッチ","3","3路スイッチ","","","個"],
["スイッチ","4","4路スイッチ","","","個"],
["コンセント","1","1口壁付コンセント","","","個"],
["コンセント","2","2口壁付コンセント","","","個"],
["コンセント","3","3口壁付コンセント","","","個"],
["コンセント","E","1口+アース","","","個"],
["コンセント","2E","2口+アース","","","個"],
["コンセント","2WPE","外部防水2口コンセント","","","個"],
["情報","TV","TVコンセント","","","個"],
["情報","TEL","TELコンセント","","","個"],
["情報","LAN","LAN","","","個"],
["空調","AC100V","エアコン用コンセント100V","","","個"],
["空調","AC200V","エアコン用コンセント200V","","","個"],
["換気","","換気扇","","","台"],
["換気","","天井換気扇","","","台"],
["インターホン","t","インターホン子機","","","台"],
["インターホン","T","インターホン親機","","","台"],
["設備","R","給湯機リモコン","","","台"],
["盤","","分電盤","","","面"],
["その他","","専用回路コンセント","","","個"],
["その他","","スポットライト","","","個"],
["その他","2+USB","2口壁付コンセント+USB1口","","","個"]
];

function addRow(v=["","","","","","個"]){
 const tr=document.createElement("tr");
 tr.innerHTML=v.map((x,i)=>`<td><input value="${x}" style="width:${i==2?180:100}px"></td>`).join("")+
 `<td><input placeholder="メーカー" style="width:100px"></td><td><input placeholder="型番/品番" style="width:120px"></td><td><input type="number" placeholder="定価" style="width:90px"></td><td><span class="badge">要確認</span></td>`;
 document.querySelector("#tbl tbody").appendChild(tr);
}
items.forEach(x=>addRow(x));
document.querySelector("#add").onclick=()=>addRow();

document.querySelector("#analyze").onclick=()=>{
 document.querySelector("#fileStatus").textContent += " ／ 解析候補を生成しました。数量は図面と照合して確定してください。";
};

document.querySelector("#file").onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 document.querySelector("#fileStatus").textContent=`選択: ${f.name}（${Math.round(f.size/1024)} KB）`;
};

["material","labor","expense","tax"].forEach(id=>document.getElementById(id).oninput=()=>{
 const m=+material.value||0,l=+labor.value||0,e=+expense.value||0,t=+tax.value||0;
 total.textContent=`合計 ${Math.round((m+l+e)*(1+t/100)).toLocaleString()} 円`;
});

document.querySelector("#export").onclick=()=>{
 const rows=[...document.querySelectorAll("#tbl tbody tr")].map(tr=>{
   const a=[...tr.querySelectorAll("input")].map(x=>x.value);
   return {category:a[0],symbol:a[1],item_name:a[2],specification:a[3],quantity:a[4],unit:a[5],manufacturer:a[6],model_number:a[7],list_price:a[8],status:"needs_verification"};
 });
 const data={app:"株式会社J.style 拾い出しアプリ",project:{name:project.value,customer:customer.value,site:site.value,drawing:drawing.value},items:rows};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jstyle_pickup_result.json";a.click();
};
</script>
</body></html>
